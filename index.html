<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ZARKING AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body { 
      background-color: #000000; 
      color: #ffffff; 
      display: flex; 
      flex-direction: column; 
      height: 100vh; 
    }
    
    /* Header Bar */
    .top-bar {
      height: 54px; 
      background: #000000; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 0 16px; 
      border-bottom: 1px solid #1a1a1a;
    }
    
    .model-title { 
      font-weight: 700; 
      font-size: 1.1rem; 
      color: #ffffff;
      letter-spacing: 0.5px;
    }
    
    .model-select { 
      background: #121212; 
      color: #007AFF; 
      border: 1px solid #2c2c2e; 
      border-radius: 8px; 
      padding: 6px 10px; 
      font-size: 0.85rem; 
      font-weight: 600;
      outline: none;
    }

    /* Chat Area */
    #chat-container { 
      flex: 1; 
      overflow-y: auto; 
      padding: 16px; 
      display: flex; 
      flex-direction: column; 
      gap: 16px; 
      background: #000000;
    }
    
    .msg { 
      max-width: 85%; 
      padding: 12px 16px; 
      border-radius: 18px; 
      font-size: 0.95rem; 
      line-height: 1.5; 
      word-break: break-word;
    }
    
    .msg.user { 
      background: #1c1c1e; 
      color: #ffffff; 
      align-self: flex-end; 
      border-bottom-right-radius: 4px;
    }
    
    .msg.bot { 
      background: #000000; 
      color: #ffffff; 
      align-self: flex-start; 
      padding-left: 0;
    }
    
    /* Action Buttons (Speaker / Copy) */
    .msg-actions { 
      display: flex; 
      gap: 10px; 
      margin-top: 10px; 
    }
    
    .btn-icon { 
      background: #1c1c1e; 
      color: #007AFF; 
      border: 1px solid #2c2c2e; 
      padding: 6px 12px; 
      border-radius: 16px; 
      cursor: pointer; 
      font-size: 0.8rem; 
      font-weight: 600;
      display: flex; 
      align-items: center; 
      gap: 6px; 
    }

    /* Input Bar */
    .input-bar { 
      padding: 12px 16px; 
      background: #000000; 
      border-top: 1px solid #1a1a1a; 
      display: flex; 
      gap: 10px; 
      align-items: center; 
    }
    
    .input-bar input { 
      flex: 1; 
      background: #1c1c1e; 
      border: 1px solid #2c2c2e; 
      color: #ffffff; 
      padding: 12px 16px; 
      border-radius: 24px; 
      outline: none; 
      font-size: 0.95rem;
    }

    .input-bar input::placeholder {
      color: #8e8e93;
    }
    
    /* Blue Buttons */
    .mic-btn, .send-btn { 
      background: #007AFF; 
      color: #ffffff; 
      border: none; 
      width: 42px; 
      height: 42px; 
      border-radius: 50%; 
      cursor: pointer; 
      font-size: 1.1rem; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0, 122, 255, 0.3);
    }

    .mic-btn.active { 
      background: #ff3b30; 
      box-shadow: 0 2px 8px rgba(255, 59, 48, 0.4);
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <div class="top-bar">
    <span class="model-title">ZARKING AI</span>
    <select class="model-select" id="modelSelect">
      <option>Gemini 1.5 Flash 0.1</option>
      <option>Gemini 1.5 Flash 0.2</option>
      <option>Gemini 1.5 Flash 0.3</option>
      <option>Gemini 1.5 Flash 0.4</option>
      <option>Gemini 1.5 Flash 0.5</option>
    </select>
  </div>

  <!-- Chat Area -->
  <div id="chat-container">
    <div class="msg bot">
      <div>नमस्ते! मैं आपकी क्या मदद कर सकता हूँ?</div>
      <div class="msg-actions">
        <button class="btn-icon" onclick="speakText('नमस्ते! मैं आपकी क्या मदद कर सकता हूँ?')">🔊 सुनें</button>
        <button class="btn-icon" onclick="copyText('नमस्ते! मैं आपकी क्या मदद कर सकता हूँ?')">📋 कॉपी</button>
      </div>
    </div>
  </div>

  <!-- Input Area with Blue Buttons -->
  <div class="input-bar">
    <button class="mic-btn" id="micBtn" onclick="startListening()" title="बोलकर लिखें">🎤</button>
    <input type="text" id="userInput" placeholder="Message ZARKING AI..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button class="send-btn" onclick="sendMessage()">➔</button>
  </div>

  <script>
    // Send Message Function
    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      input.value = '';

      const botMsgDiv = appendMessage('सोच रहा हूँ...', 'bot');

      try {
        const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(text)}`);
        const data = await res.text();
        
        botMsgDiv.innerHTML = `
          <div>${escapeHtml(data)}</div>
          <div class="msg-actions">
            <button class="btn-icon" onclick="speakText(\`${data.replace(/`/g, '')}\`)">🔊 सुनें</button>
            <button class="btn-icon" onclick="copyText(\`${data.replace(/`/g, '')}\`)">📋 कॉपी</button>
          </div>
        `;
      } catch (err) {
        botMsgDiv.innerHTML = `<div>नमस्ते ज़ार्किंग! मैं एक्टिव हूँ, बताइए क्या काम है?</div>`;
      }
    }

    function appendMessage(text, type) {
      const container = document.getElementById('chat-container');
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.innerHTML = `<div>${escapeHtml(text)}</div>`;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
      return div;
    }

    // Text to Speech
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'hi-IN';
        window.speechSynthesis.speak(utterance);
      } else {
        alert("आपका फ़ोन वॉइस आउटपुट सपोर्ट नहीं कर रहा है।");
      }
    }

    // Copy Text
    function copyText(text) {
      navigator.clipboard.writeText(text);
      alert("कॉपी हो गया!");
    }

    // Speech to Text (Microphone)
    function startListening() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("कृपया Google Chrome का इस्तेमाल करें।");
        return;
      }

      const recognition = new SpeechRecognition();
      const micBtn = document.getElementById('micBtn');

      recognition.onstart = function() {
        micBtn.classList.add('active');
      };

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        document.getElementById('userInput').value = transcript;
        micBtn.classList.remove('active');
      };

      recognition.onerror = function() { micBtn.classList.remove('active'); };
      recognition.onend = function() { micBtn.classList.remove('active'); };

      recognition.start();
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));
    }
  </script>
</body>
</html>
