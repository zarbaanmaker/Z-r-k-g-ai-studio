<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ZARKING AI STUDIO</title>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-header: #111827;
      --bg-card: #1f2937;
      --bg-input: #111827;
      --zarking-purple: #8b5cf6;
      --text-white: #f9fafb;
      --text-dim: #9ca3af;
      --user-msg-bg: #374151;
      --border-dark: #374151;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-white);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top App Bar */
    .mobile-app-bar {
      height: 55px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-dark);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
    }

    .app-title {
      font-size: 1.1rem;
      font-weight: 800;
      background: linear-gradient(90deg, #a855f7, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mode-tabs {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-dark);
      overflow-x: auto;
      flex-shrink: 0;
    }

    .tab-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-dark);
      color: var(--text-dim);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--zarking-purple);
      color: #fff;
      border-color: var(--zarking-purple);
    }

    /* Chat Viewport */
    #chat-viewport {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      -webkit-overflow-scrolling: touch;
    }

    .msg-row {
      display: flex;
      gap: 10px;
      max-width: 92%;
      align-items: flex-start;
    }

    .msg-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-row.bot { align-self: flex-start; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .user .avatar { background: var(--user-msg-bg); color: #fff; }
    .bot .avatar { background: var(--zarking-purple); color: #fff; }

    .msg-content {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 100%;
    }

    .msg-bubble {
      background: var(--bg-card);
      padding: 12px 14px;
      border-radius: 16px;
      font-size: 0.9rem;
      line-height: 1.4;
      color: var(--text-white);
      border: 1px solid var(--border-dark);
      word-break: break-word;
    }

    .user .msg-bubble {
      background: var(--zarking-purple);
      border-top-right-radius: 2px;
      border-color: transparent;
    }

    .bot .msg-bubble { border-top-left-radius: 2px; }

    .msg-bubble img, .msg-bubble video {
      width: 100%;
      border-radius: 10px;
      margin-top: 8px;
    }

    /* Action Buttons Under Bot Messages */
    .msg-actions {
      display: flex;
      gap: 12px;
      padding-left: 4px;
    }

    .action-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .action-btn:hover, .action-btn.active { color: var(--text-white); }

    /* Bottom Input Bar */
    .bottom-input-area {
      padding: 8px 12px 12px 12px;
      background: var(--bg-header);
      border-top: 1px solid var(--border-dark);
      flex-shrink: 0;
    }

    .input-box-wrapper {
      background: var(--bg-input);
      border: 1px solid var(--border-dark);
      border-radius: 24px;
      padding: 4px 6px 4px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-input-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 1.1rem;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .icon-input-btn:active { color: var(--zarking-purple); }

    #mobile-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.95rem;
      padding: 8px 0;
    }

    .btn-submit-send {
      background: var(--zarking-purple);
      border: none;
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Hidden File Input -->
  <input type="file" id="file-upload" style="display: none;" onchange="handleFileUpload(event)">

  <!-- Header -->
  <header class="mobile-app-bar">
    <div class="app-title"><i class="fa-solid fa-bolt"></i> ZARKING AI STUDIO</div>
  </header>

  <!-- Navigation Tabs -->
  <div class="mode-tabs">
    <button class="tab-btn active" onclick="setMode('chat', this)"><i class="fa-solid fa-comments"></i> AI Chat</button>
    <button class="tab-btn" onclick="setMode('image', this)"><i class="fa-solid fa-image"></i> HD Photo</button>
    <button class="tab-btn" onclick="setMode('video', this)"><i class="fa-solid fa-video"></i> 10s Video Clip</button>
  </div>

  <!-- Chat Viewport -->
  <main id="chat-viewport">
    <div class="msg-row bot">
      <div class="avatar"><i class="fa-solid fa-robot"></i></div>
      <div class="msg-content">
        <div class="msg-bubble">
          नमस्ते! मैं <b>ZARKING AI</b> हूँ। आप मुझसे बात कर सकते हैं, HD फोटोज़ बना सकते हैं और 10 सेकंड की AI वीडियो क्लिप्स जनरेट कर सकते हैं।
        </div>
      </div>
    </div>
  </main>

  <!-- Input Bar -->
  <div class="bottom-input-area">
    <div class="input-box-wrapper">
      <button class="icon-input-btn" onclick="document.getElementById('file-upload').click()"><i class="fa-solid fa-plus"></i></button>
      <button class="icon-input-btn" onclick="startVoiceRecognition()"><i class="fa-solid fa-microphone" id="mic-icon"></i></button>
      <input type="text" id="mobile-input" placeholder="ZARKING AI से बात करें..." onkeypress="onKeyPress(event)">
      <button class="btn-submit-send" onclick="handleSend()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>

  <script>
    let activeMode = 'chat';
    let lastUserPrompt = '';

    function setMode(mode, btn) {
      activeMode = mode;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const input = document.getElementById('mobile-input');
      if (mode === 'chat') input.placeholder = 'ZARKING AI से बात करें...';
      if (mode === 'image') input.placeholder = 'कैसी HD फोटो बनानी है?...';
      if (mode === 'video') input.placeholder = '10 सेकंड की वीडियो क्लिप का टॉपिक लिखें...';
    }

    function onKeyPress(e) { if (e.key === 'Enter') handleSend(); }

    function appendUserMessage(text) {
      const viewport = document.getElementById('chat-viewport');
      const row = document.createElement('div');
      row.className = 'msg-row user';
      row.innerHTML = `
        <div class="avatar"><i class="fa-solid fa-user"></i></div>
        <div class="msg-content">
          <div class="msg-bubble">${escapeHtml(text)}</div>
        </div>
      `;
      viewport.appendChild(row);
      viewport.scrollTop = viewport.scrollHeight;
    }

    function appendBotMessage(contentHTML) {
      const viewport = document.getElementById('chat-viewport');
      const row = document.createElement('div');
      row.className = 'msg-row bot';
      const msgId = 'msg-' + Date.now();

      row.innerHTML = `
        <div class="avatar"><i class="fa-solid fa-robot"></i></div>
        <div class="msg-content">
          <div class="msg-bubble" id="${msgId}">${contentHTML}</div>
          <div class="msg-actions">
            <button class="action-btn" onclick="copyMessage('${msgId}')"><i class="fa-solid fa-copy"></i> Copy</button>
            <button class="action-btn" onclick="retryLastMessage()"><i class="fa-solid fa-rotate-right"></i> Retry</button>
            <button class="action-btn" onclick="toggleLike(this)"><i class="fa-solid fa-thumbs-up"></i></button>
            <button class="action-btn" onclick="toggleDislike(this)"><i class="fa-solid fa-thumbs-down"></i></button>
          </div>
        </div>
      `;
      viewport.appendChild(row);
      viewport.scrollTop = viewport.scrollHeight;
      return msgId;
    }

    async function handleSend() {
      const inputEl = document.getElementById('mobile-input');
      const txt = inputEl.value.trim();
      if (!txt) return;

      lastUserPrompt = txt;
      appendUserMessage(txt);
      inputEl.value = '';

      if (activeMode === 'chat') {
        const loadingId = appendBotMessage("<i>सोच रहा हूँ...</i>");
        try {
          const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(txt)}`);
          const reply = await res.text();
          document.getElementById(loadingId).innerText = reply;
        } catch (err) {
          document.getElementById(loadingId).innerText = "क्षमा करें, सर्वर से संपर्क नहीं हो सका। कृपया पुनः प्रयास करें।";
        }
      } 
      else if (activeMode === 'image') {
        const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(txt)}?width=1024&height=1024&seed=${Math.floor(Math.random()*99999)}`;
        appendBotMessage(`यहाँ आपकी HD फोटो है:<br><img src="${imgUrl}" alt="AI Photo">`);
      } 
      else if (activeMode === 'video') {
        const videoUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(txt)}?width=1024&height=576&seed=${Math.floor(Math.random()*99999)}&model=video`;
        appendBotMessage(`🎬 10 सेकंड की AI वीडियो क्लिप जनरेट हो रही है...<br><img src="${videoUrl}" alt="AI Video Preview">`);
      }
    }

    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (file) {
        appendUserMessage(`📁 अपलोड की गई फाइल: ${file.name}`);
        appendBotMessage(`फाइल <b>${escapeHtml(file.name)}</b> प्राप्त हो गई है!`);
      }
    }

    function startVoiceRecognition() {
      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'hi-IN';

        const micIcon = document.getElementById('mic-icon');
        micIcon.style.color = '#ef4444';

        recognition.onresult = function(event) {
          const transcript = event.results[0][0].transcript;
          document.getElementById('mobile-input').value = transcript;
          micIcon.style.color = '';
        };

        recognition.onerror = function() { micIcon.style.color = ''; };
        recognition.onend = function() { micIcon.style.color = ''; };

        recognition.start();
      } else {
        alert("आपके ब्राउज़र में वॉइस टाइपिंग सपोर्ट उपलब्ध नहीं है।");
      }
    }

    function copyMessage(id) {
      const text = document.getElementById(id).innerText;
      navigator.clipboard.writeText(text);
      alert("मैसेज कॉपी हो गया!");
    }

    function retryLastMessage() {
      if (lastUserPrompt) {
        document.getElementById('mobile-input').value = lastUserPrompt;
        handleSend();
      }
    }

    function toggleLike(btn) { btn.classList.toggle('active'); }
    function toggleDislike(btn) { btn.classList.toggle('active'); }

    function escapeHtml(string) {
      return String(string).replace(/[&<>"']/g, function(s) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s];
      });
    }
  </script>
</body>
  </html>
