<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ZARKING AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100dvh;
      background-color: #000000;
      color: #ffffff;
      overflow: hidden;
    }

    /* Side Drawer */
    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      z-index: 99;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100%;
      background-color: #0d0d0d;
      z-index: 100;
      transition: left 0.25s ease;
      display: flex;
      flex-direction: column;
      padding: 12px;
      border-right: 1px solid #1f1f1f;
    }

    .sidebar.open, .sidebar-overlay.open {
      display: block;
    }
    .sidebar.open {
      left: 0;
    }

    .new-chat-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #1a1a1a;
      color: #fff;
      padding: 12px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      border: 1px solid #2a2a2a;
      margin-bottom: 16px;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
    }

    .history-item {
      padding: 10px 12px;
      border-radius: 6px;
      color: #a0a0a0;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .history-item:hover {
      background-color: #1a1a1a;
      color: #fff;
    }

    .user-profile {
      border-top: 1px solid #1f1f1f;
      padding-top: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .user-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background-color: #333333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
      font-size: 0.9rem;
    }

    /* Main App Layout */
    .app-layout {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      position: relative;
    }

    /* Top Navigation Header */
    .top-bar {
      height: 52px;
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-bottom: 1px solid #1a1a1a;
      flex-shrink: 0;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 1.1rem;
      cursor: pointer;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
    }

    .brand-title {
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Chat Container */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 90px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      background-color: #000000;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 100%;
    }

    .message.user {
      align-items: flex-end;
    }

    .message.bot {
      align-items: flex-start;
    }

    .bubble {
      max-width: 90%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .message.user .bubble {
      background-color: #1f1f1f;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .message.bot .bubble {
      background-color: transparent;
      color: #e5e5e5;
      padding: 0;
    }

    /* Bottom Fixed Input Bar */
    .input-area {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #000000;
      padding: 10px 14px 16px 14px;
      border-top: 1px solid #141414;
    }

    .input-wrapper {
      background-color: #121212;
      border: 1px solid #262626;
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding: 6px 12px;
      gap: 8px;
    }

    .input-wrapper input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 0.95rem;
      padding: 8px 4px;
    }

    .input-wrapper input::placeholder {
      color: #666666;
    }

    .action-btn {
      background-color: #ffffff;
      color: #000000;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .action-btn.stop {
      background-color: #ffffff;
      color: #000000;
    }
  </style>
</head>
<body>

  <!-- Overlay -->
  <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

  <!-- Side Drawer Menu -->
  <div class="sidebar" id="sidebar">
    <div class="new-chat-btn" onclick="startNewChat()">
      <span><i class="fa-solid fa-plus"></i> New Chat</span>
      <i class="fa-regular fa-pen-to-square"></i>
    </div>

    <div class="history-list">
      <div class="history-item"><i class="fa-regular fa-message"></i> Recent Chat</div>
    </div>

    <div class="user-profile">
      <div class="user-avatar">Z</div>
      <div>
        <div style="font-weight: 600; font-size: 0.88rem;">Zarking Account</div>
        <div style="font-size: 0.75rem; color: #777777;">Settings</div>
      </div>
    </div>
  </div>

  <!-- Main View -->
  <div class="app-layout">

    <!-- Top Navigation Header -->
    <div class="top-bar">
      <button class="icon-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
      <div class="brand-title">ZARKING AI</div>
      <button class="icon-btn" onclick="startNewChat()"><i class="fa-regular fa-pen-to-square"></i></button>
    </div>

    <!-- Chat Stream -->
    <div id="chat-container">
      <div class="message bot">
        <div class="bubble">How can I help you today?</div>
      </div>
    </div>

    <!-- Input Box Bar -->
    <div class="input-area">
      <div class="input-wrapper">
        <input type="text" id="userInput" placeholder="Message ZARKING AI..." onkeypress="handleKeyPress(event)">
        <button class="action-btn" id="actionBtn" onclick="handleAction()"><i class="fa-solid fa-arrow-up"></i></button>
      </div>
    </div>

  </div>

  <script>
    let currentAbortController = null;

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlay').classList.toggle('open');
    }

    function startNewChat() {
      if (currentAbortController) {
        currentAbortController.abort();
        currentAbortController = null;
      }
      setSendButtonState(false);
      document.getElementById('chat-container').innerHTML = `
        <div class="message bot">
          <div class="bubble">How can I help you today?</div>
        </div>
      `;
      if (document.getElementById('sidebar').classList.contains('open')) {
        toggleSidebar();
      }
    }

    function handleAction() {
      if (currentAbortController) {
        // Stop Generation Action
        currentAbortController.abort();
        currentAbortController = null;
        setSendButtonState(false);
      } else {
        // Send Message Action
        sendMessage();
      }
    }

    async function sendMessage() {
      const inputEl = document.getElementById('userInput');
      const text = inputEl.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      inputEl.value = '';

      const botMsgId = appendMessage('...', 'bot');
      setSendButtonState(true);

      currentAbortController = new AbortController();

      try {
        const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(text)}`, {
          signal: currentAbortController.signal
        });
        const data = await response.text();
        document.getElementById(botMsgId).innerText = data;
      } catch (error) {
        if (error.name === 'AbortError') {
          document.getElementById(botMsgId).innerText = "[Generation Stopped]";
        } else {
          document.getElementById(botMsgId).innerText = "Error fetching response. Please try again.";
        }
      } finally {
        currentAbortController = null;
        setSendButtonState(false);
      }
    }

    function setSendButtonState(isGenerating) {
      const btn = document.getElementById('actionBtn');
      if (isGenerating) {
        btn.className = 'action-btn stop';
        btn.innerHTML = '<i class="fa-solid fa-square" style="font-size: 0.75rem;"></i>';
      } else {
        btn.className = 'action-btn';
        btn.innerHTML = '<i class="fa-solid fa-arrow-up"></i>';
      }
    }

    function appendMessage(text, sender) {
      const container = document.getElementById('chat-container');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;
      const msgId = 'msg-' + Date.now();

      msgDiv.innerHTML = `<div class="bubble" id="${msgId}">${escapeHtml(text)}</div>`;

      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
      return msgId;
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, function(s) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s];
      });
    }
  </script>
</body>
        </html>
