<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ZARKING AI</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #212121;
      color: #ececec;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Bar */
    .top-bar {
      height: 50px;
      background-color: #171717;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid #2f2f2f;
      flex-shrink: 0;
    }

    .app-title {
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Chat Container */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .message {
      display: flex;
      gap: 12px;
      max-width: 100%;
    }

    .message.user {
      justify-content: flex-end;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background-color: #2f2f2f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      flex-shrink: 0;
      color: #fff;
    }

    .message.user .avatar {
      background-color: #383838;
    }

    .message.bot .avatar {
      background-color: #10a37f; /* Standard AI Green Accent */
    }

    .bubble {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-break: break-word;
    }

    .message.user .bubble {
      background-color: #303030;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .message.bot .bubble {
      background-color: transparent;
      color: #ececec;
      padding-left: 0;
    }

    /* Bottom Input Box */
    .input-area {
      padding: 12px 16px 20px 16px;
      background-color: #212121;
      flex-shrink: 0;
    }

    .input-wrapper {
      background-color: #2f2f2f;
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding: 6px 12px;
      border: 1px solid #424242;
    }

    .input-wrapper input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 0.95rem;
      padding: 8px 4px;
    }

    .input-wrapper input::placeholder {
      color: #8e8e8e;
    }

    .send-btn {
      background-color: #ffffff;
      color: #000000;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .send-btn:disabled {
      background-color: #676767;
      color: #2f2f2f;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="top-bar">
    <div class="app-title"><i class="fa-solid fa-sparkles"></i> ZARKING AI</div>
  </div>

  <!-- Chat History -->
  <div id="chat-container">
    <div class="message bot">
      <div class="avatar"><i class="fa-solid fa-robot"></i></div>
      <div class="bubble">How can I help you today?</div>
    </div>
  </div>

  <!-- Bottom Input Bar -->
  <div class="input-area">
    <div class="input-wrapper">
      <input type="text" id="userInput" placeholder="Message ZARKING AI..." onkeypress="handleKeyPress(event)">
      <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-arrow-up"></i></button>
    </div>
  </div>

  <script>
    async function sendMessage() {
      const inputEl = document.getElementById('userInput');
      const text = inputEl.value.trim();
      if (!text) return;

      // Append User Message
      appendMessage(text, 'user');
      inputEl.value = '';

      // Append Bot Loading Message
      const botMsgId = appendMessage('...', 'bot');

      try {
        const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(text)}`);
        const data = await response.text();
        document.getElementById(botMsgId).innerText = data;
      } catch (error) {
        document.getElementById(botMsgId).innerText = "Error getting response. Please try again.";
      }
    }

    function appendMessage(text, sender) {
      const container = document.getElementById('chat-container');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${sender}`;

      const msgId = 'msg-' + Date.now();

      if (sender === 'user') {
        msgDiv.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
      } else {
        msgDiv.innerHTML = `
          <div class="avatar"><i class="fa-solid fa-robot"></i></div>
          <div class="bubble" id="${msgId}">${escapeHtml(text)}</div>
        `;
      }

      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
      return msgId;
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, function(s) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s];
      });
    }
  </script>
</body>
  </html>
